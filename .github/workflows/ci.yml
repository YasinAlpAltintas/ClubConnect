
name: ClubConnect CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. FRONTEND - REACT
  # ==========================================
  frontend:
    name: React Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check linting
        run: npm run lint --if-present

      - name: Build React
        run: npm run build

  # ==========================================
  # 2. BACKEND - ASP.NET CORE 10
  # ==========================================
  backend:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Restore dependencies
        run: dotnet restore ClubConnect.slnx

      - name: Build backend
        run: >
          dotnet build ClubConnect.slnx
          --no-restore
          --configuration Release

      - name: Run .NET tests
        run: >
          dotnet test ClubConnect.slnx
          --no-build
          --configuration Release

  # ==========================================
  # 3. DOCKER - NATIVE ARM64 BUILD
  # ==========================================
  docker-build:
    name: Docker ARM64 Build
    runs-on: ubuntu-24.04-arm

    needs:
      - frontend
      - backend

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build React ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=clubconnect-frontend

      - name: Build .NET ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=clubconnect-backend

  # ==========================================
  # 4. PUBLISH DOCKER IMAGES TO GHCR
  # ==========================================
  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-24.04-arm

    needs:
      - frontend
      - backend
      - docker-build

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'yasinalpaltintas/ClubConnect'

    permissions:
      contents: read
      packages: write

    outputs:
      frontend-image: ${{ steps.images.outputs.frontend }}
      backend-image: ${{ steps.images.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: images
        run: |
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish React ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: >-
            ${{ steps.images.outputs.frontend }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=clubconnect-frontend
          cache-to: type=gha,mode=max,scope=clubconnect-frontend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Publish .NET ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: >-
            ${{ steps.images.outputs.backend }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=clubconnect-backend
          cache-to: type=gha,mode=max,scope=clubconnect-backend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # ==========================================
  # 5. NON-PROD - DOCKER COMPOSE VERIFICATION
  # ==========================================
  staging-compose-test:
    name: Staging Compose Test
    runs-on: ubuntu-latest

    needs:
      - publish-images

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    environment: staging

    concurrency:
      group: clubconnect-staging
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test Docker Compose on NON-PROD
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/clubconnect

          echo "Validating Docker Compose..."
          docker compose -f compose.test.yml config --quiet

          echo "Running registry test container..."
          output=$(docker compose -f compose.test.yml run --rm registry-test 2>&1)

          printf '%s\n' "$output"

          echo "Verifying result..."
          grep -Fq \
            'ClubConnect GHCR test successful!' \
            <<< "$output"

          echo "Staging Compose test passed!"
          REMOTE

      - name: Deployment verification complete
        run: |
          echo "GitHub Actions connected to NON-PROD."
          echo "Docker Compose verification passed."
