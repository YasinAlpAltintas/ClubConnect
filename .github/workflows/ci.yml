
name: ClubConnect CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. FRONTEND - REACT
  # ==========================================
  frontend:
    name: React Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check linting
        run: npm run lint --if-present

      - name: Run unit & component tests with coverage
        run: npm run test:coverage

      - name: Build React
        run: npm run build

  # ==========================================
  # 2. BACKEND - ASP.NET CORE 10
  # ==========================================
  backend:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Restore dependencies
        run: dotnet restore ClubConnect.slnx

      - name: Build backend
        run: >
          dotnet build ClubConnect.slnx
          --no-restore
          --configuration Release

      - name: Run .NET tests with coverage
        run: >
          dotnet test ClubConnect.slnx
          --no-build
          --configuration Release
          /p:CollectCoverage=true

  # ==========================================
  # 3. PLAYWRIGHT - END-TO-END TESTS
  # ==========================================
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clubconnect
          POSTGRES_USER: clubconnect
          POSTGRES_PASSWORD: clubconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubconnect -d clubconnect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers & dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend API & Run Playwright E2E tests
        working-directory: frontend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=clubconnect;Username=clubconnect;Password=clubconnect
          ClubConnect__Cors__AllowedOrigins__0: http://localhost:5173
          ClubConnect__Cors__AllowedOrigins__1: http://127.0.0.1:5173
          VITE_API_URL: http://127.0.0.1:5069
        run: |
          echo "Checking if port 5069 is in use..."
          ss -lptn 'sport = :5069' || true
          lsof -i :5069 || true

          echo "Applying database migrations to disposable PostgreSQL test database..."
          dotnet run --project ../backend/ClubConnect.Api --configuration Release --no-launch-profile -- --migrate

          echo "Starting backend API in background..."
          dotnet run --project ../backend/ClubConnect.Api --configuration Release --no-launch-profile --urls "http://127.0.0.1:5069" > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!

          echo "Waiting for backend API readiness at http://127.0.0.1:5069/health..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:5069/health | grep -q "Healthy"; then
              echo "Backend API is ready and healthy!"
              READY=1
              break
            fi
            echo "Attempt $i/30: backend not ready yet, sleeping 1s..."
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Error: Backend API failed to become ready within 30 seconds."
            echo "=== Backend logs ==="
            cat /tmp/backend.log || true
            echo "===================="
            kill $BACKEND_PID 2>/dev/null || true
            exit 1
          fi

          echo "Running Playwright E2E tests..."
          npm run test:e2e
          TEST_EXIT_CODE=$?

          echo "Cleaning up backend API process ($BACKEND_PID)..."
          kill $BACKEND_PID 2>/dev/null || true

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "=== Backend logs (post-test failure) ==="
            cat /tmp/backend.log || true
            echo "========================================"
          fi

          exit $TEST_EXIT_CODE

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==========================================
  # 4. DOCKER - NATIVE ARM64 BUILD
  # ==========================================
  docker-build:
    name: Docker ARM64 Build
    runs-on: ubuntu-24.04-arm

    needs:
      - frontend
      - backend
      - e2e

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build React ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=clubconnect-frontend

      - name: Build .NET ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=clubconnect-backend

  # ==========================================
  # 5. PUBLISH DOCKER IMAGES TO GHCR
  # ==========================================
  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-24.04-arm

    needs:
      - frontend
      - backend
      - e2e
      - docker-build

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      (github.repository == 'yasinalpaltintas/ClubConnect' || github.repository == 'YasinAlpAltintas/ClubConnect')

    permissions:
      contents: read
      packages: write

    outputs:
      frontend-image: ${{ steps.images.outputs.frontend }}
      backend-image: ${{ steps.images.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names
        id: images
        run: |
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish React ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: >-
            ${{ steps.images.outputs.frontend }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=clubconnect-frontend
          cache-to: type=gha,mode=max,scope=clubconnect-frontend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Publish .NET ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: >-
            ${{ steps.images.outputs.backend }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=clubconnect-backend
          cache-to: type=gha,mode=max,scope=clubconnect-backend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # ==========================================
  # 6. NON-PROD - DOCKER COMPOSE VERIFICATION
  # ==========================================
  staging-compose-test:
    name: Staging Compose Test
    runs-on: ubuntu-latest

    needs:
      - publish-images

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      (github.repository == 'yasinalpaltintas/ClubConnect' || github.repository == 'YasinAlpAltintas/ClubConnect')

    environment: staging

    concurrency:
      group: clubconnect-staging
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test Docker Compose on NON-PROD
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/clubconnect

          echo "Validating Docker Compose..."
          docker compose -f compose.test.yml config --quiet

          echo "Running registry test container..."
          output=$(docker compose -f compose.test.yml run --rm registry-test 2>&1)

          printf '%s\n' "$output"

          echo "Verifying result..."
          grep -Fq \
            'ClubConnect GHCR test successful!' \
            <<< "$output"

          echo "Staging Compose test passed!"
          REMOTE

      - name: Deployment verification complete
        run: |
          echo "GitHub Actions connected to NON-PROD."
          echo "Docker Compose verification passed."

  # ==========================================
  # 7. NON-PROD - AUTOMATIC STAGING DEPLOYMENT
  # ==========================================
  deploy-staging:
    name: Deploy to Staging (CC-NPR)
    runs-on: ubuntu-latest

    needs:
      - publish-images
      - staging-compose-test

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      (github.repository == 'yasinalpaltintas/ClubConnect' || github.repository == 'YasinAlpAltintas/ClubConnect')

    environment: staging

    concurrency:
      group: clubconnect-staging
      cancel-in-progress: false

    steps:
      - name: Validate Staging Secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ] || [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Required staging secrets (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS) are missing in environment 'staging'." >&2
            exit 1
          fi
          echo "All required staging secrets verified present."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Staging Deployment Ordering
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Checking currently deployed release on ${DEPLOY_HOST}..."
          current_release_tag=$(ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat /opt/clubconnect/releases/staging_current.release 2>/dev/null | grep -E '^IMAGE_TAG=' | cut -d '=' -f2 || true")

          if [ -n "$current_release_tag" ]; then
            current_sha="${current_release_tag#sha-}"
            echo "Currently deployed release on staging: ${current_sha}"
            echo "Candidate release to deploy: ${TARGET_SHA}"

            if [ "$current_sha" = "$TARGET_SHA" ]; then
              echo "Candidate matches currently deployed release (redeploy permitted)."
            elif git cat-file -e "${current_sha}^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "${TARGET_SHA}" "${current_sha}"; then
                echo "::error::Deployment rejected: Target commit ${TARGET_SHA} is an older ancestor of currently deployed release ${current_sha}." >&2
                echo "::error::An older CI run cannot overwrite a newer release. Automatic deployment aborted." >&2
                exit 1
              else
                echo "Release ordering verified: Target commit ${TARGET_SHA} is not an ancestor of ${current_sha}."
              fi
            else
              echo "Note: Current deployed SHA ${current_sha} not found in local git history. Proceeding with deployment."
            fi
          else
            echo "No current release metadata found on staging host. Initial deployment."
          fi

      - name: Synchronize versioned release package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Creating versioned release directory on ${DEPLOY_HOST}: /opt/clubconnect/releases/${COMMIT_SHA}..."
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '/opt/clubconnect/releases/${COMMIT_SHA}/scripts' '/opt/clubconnect/releases/${COMMIT_SHA}/deploy'"

          echo "Uploading release scripts and Compose templates..."
          tar -czf - scripts deploy | ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "tar -xzf - -C '/opt/clubconnect/releases/${COMMIT_SHA}/'"

      - name: Execute staging deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Executing versioned deploy.sh on ${DEPLOY_HOST}..."
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "COMMIT_SHA='$COMMIT_SHA' IMAGE_TAG='$IMAGE_TAG' bash -se" <<'EOF'
          set -euo pipefail
          chmod +x "/opt/clubconnect/releases/${COMMIT_SHA}/scripts/"*.sh
          "/opt/clubconnect/releases/${COMMIT_SHA}/scripts/deploy.sh" staging "${IMAGE_TAG}"
          EOF

      - name: Retrieve staging deployment evidence
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Retrieving verified staging deployment evidence..."
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat '/opt/clubconnect/releases/${COMMIT_SHA}/staging_evidence.json'" > staging_evidence.json

          cat staging_evidence.json

          # Validate staging evidence integrity
          evidence_commit=$(jq -r '.commit_sha // empty' staging_evidence.json)
          evidence_smoke=$(jq -r '.smoke_test // empty' staging_evidence.json)
          frontend_digest=$(jq -r '.frontend_digest // empty' staging_evidence.json)
          backend_digest=$(jq -r '.backend_digest // empty' staging_evidence.json)

          if [ "$evidence_commit" != "$COMMIT_SHA" ]; then
            echo "::error::Staging evidence commit ($evidence_commit) does not match requested commit ($COMMIT_SHA)." >&2
            exit 1
          fi

          if [ "$evidence_smoke" != "PASSED" ]; then
            echo "::error::Staging smoke test did not pass (status: $evidence_smoke)." >&2
            exit 1
          fi

          if [ -z "$frontend_digest" ] || [ -z "$backend_digest" ]; then
            echo "::error::Staging evidence does not contain verified image digests." >&2
            exit 1
          fi

          echo "Staging deployment and smoke tests verified successfully for commit $COMMIT_SHA."

      - name: Upload staging evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ github.sha }}
          path: staging_evidence.json
          retention-days: 30
