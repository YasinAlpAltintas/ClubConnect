
name: Test GHCR Publishing

on:
  push:
    branches:
      - develop
    paths:
      - "devops/registry-test/**"
      - ".github/workflows/test-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ARM64 Test Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-registry-test" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./devops/registry-test
          file: ./devops/registry-test/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
